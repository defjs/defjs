name: Release

# Manual, pick-what-you-want trigger. GitHub Actions has no native multi-select input, so each
# target is its own checkbox in the "Run workflow" form; tick any combination. Package versions
# are whatever is already committed in each packages/*/package.json — nothing here bumps them.
on:
  workflow_dispatch:
    inputs:
      cli:
        description: Publish @defjs/cli to npm
        type: boolean
        default: false
      core:
        description: Publish @defjs/core to npm
        type: boolean
        default: false
      opentelemetry-server:
        description: Publish @defjs/opentelemetry-server to npm
        type: boolean
        default: false
      react:
        description: Publish @defjs/react to npm
        type: boolean
        default: false
      vue:
        description: Publish @defjs/vue to npm
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Runs on every manual dispatch, including one with no publish targets.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun run typecheck
      - run: bun run build

  cli:
    needs: validate
    if: ${{ inputs.cli }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # npm is the registry's trusted-publishing CLI. Bun publish does not support
      # npm OIDC trusted publishing (oven-sh/bun#22423), so publishing keeps npm.
      - name: Install npm with trusted publishing support
        run: npm install --global npm@12.2.1
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun --bun run build
        working-directory: packages/cli
      - name: Assert packed files
        run: bun test/assert-pack.ts packages/cli/dist
      - working-directory: packages/cli/dist
        run: npm publish --access public

  core:
    needs: validate
    if: ${{ inputs.core }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # npm is the registry's trusted-publishing CLI. Bun publish does not support
      # npm OIDC trusted publishing (oven-sh/bun#22423), so publishing keeps npm.
      - name: Install npm with trusted publishing support
        run: npm install --global npm@12.2.1
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun --bun run build
        working-directory: packages/core
      - name: Assert packed files
        run: bun test/assert-pack.ts packages/core/dist
      - working-directory: packages/core/dist
        run: npm publish --access public

  opentelemetry-server:
    needs: validate
    if: ${{ inputs.opentelemetry-server }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # npm is the registry's trusted-publishing CLI. Bun publish does not support
      # npm OIDC trusted publishing (oven-sh/bun#22423), so publishing keeps npm.
      - name: Install npm with trusted publishing support
        run: npm install --global npm@12.2.1
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      # The build type-checks against ../core/dist (tsconfig.build.json), so Core is built first.
      - name: Build @defjs/core
        run: bun --bun run build
        working-directory: packages/core
      - run: bun --bun run build
        working-directory: packages/opentelemetry-server
      - name: Assert packed files
        run: bun test/assert-pack.ts packages/opentelemetry-server/dist
      - working-directory: packages/opentelemetry-server/dist
        run: npm publish --access public

  react:
    needs: validate
    if: ${{ inputs.react }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # npm is the registry's trusted-publishing CLI. Bun publish does not support
      # npm OIDC trusted publishing (oven-sh/bun#22423), so publishing keeps npm.
      - name: Install npm with trusted publishing support
        run: npm install --global npm@12.2.1
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      # The build type-checks against ../core/dist (tsconfig.build.json), so Core is built first.
      - name: Build @defjs/core
        run: bun --bun run build
        working-directory: packages/core
      - run: bun --bun run build
        working-directory: packages/react
      - name: Assert packed files
        run: bun test/assert-pack.ts packages/react/dist
      - working-directory: packages/react/dist
        run: npm publish --access public

  vue:
    needs: validate
    if: ${{ inputs.vue }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # npm is the registry's trusted-publishing CLI. Bun publish does not support
      # npm OIDC trusted publishing (oven-sh/bun#22423), so publishing keeps npm.
      - name: Install npm with trusted publishing support
        run: npm install --global npm@12.2.1
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      # The build type-checks against ../core/dist (tsconfig.build.json), so Core is built first.
      - name: Build @defjs/core
        run: bun --bun run build
        working-directory: packages/core
      - run: bun --bun run build
        working-directory: packages/vue
      - name: Assert packed files
        run: bun test/assert-pack.ts packages/vue/dist
      - working-directory: packages/vue/dist
        run: npm publish --access public
