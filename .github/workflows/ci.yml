name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      # Type-aware lint reads the generated route types in doc/.react-router, which are not committed.
      - name: Generate route types
        run: bun run --cwd doc typegen
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun fmt --check
      - name: Typecheck
        run: bun run typecheck

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - name: Build
        run: bun run build

  unit-chrome:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - name: Install Playwright browsers
        run: bunx --bun playwright install --with-deps chromium
      - name: Unit tests (Chrome)
        run: bun run unit:chrome

  unit-firefox:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - name: Install Playwright browsers
        run: bunx --bun playwright install --with-deps firefox
      - name: Unit tests (Firefox)
        run: bun run unit:firefox

  unit-bun:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - name: Unit tests (Bun)
        run: bun run unit:bun

  unit-node:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            packages/core/package-lock.json
            packages/opentelemetry-server/package-lock.json
      - name: Install packages that run on Node
        shell: bash
        run: |
          for lock in packages/*/package-lock.json; do
            (cd "$(dirname "$lock")" && npm ci --ignore-scripts --workspaces=false)
          done
      - name: Unit tests (Node)
        run: node --run unit:node
