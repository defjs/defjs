name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun ci
      - name: Install Playwright browsers
        run: bunx --bun playwright install --with-deps chromium firefox
      # Type-aware lint reads the generated route types in doc/.react-router, which are not committed.
      - name: Generate route types
        run: bun run --cwd doc typegen
      - name: Lint
        run: bun lint
      - name: Format check
        run: bun fmt --check
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test:unit
      - name: Build
        run: bun run build
      - name: E2E tests
        run: bun run test:e2e
